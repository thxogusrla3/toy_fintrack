spring.application.name=fintrack
server.port=8080

# H2
spring.datasource.url=jdbc:h2:tcp://localhost:9092/~/fintrack
#spring.datasource.url=jdbc:h2:file:C:/h2/bin/fintrack
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=1
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.platform=h2

# JPA
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect


# === JWT ?? ===
app.jwt.secret-base64=sZRHbEGwS7AxZI3iFFzvUUOsRjcHBQVdl/VDD+e2tqc=
app.jwt.access-ttl-seconds=900                 # Access 15?
app.jwt.refresh-ttl-seconds=1209600            # Refresh 14?

# Refresh token cookie - local HTTP server
app.cookie.refresh-token.secure=false
app.cookie.refresh-token.same-site=Lax
app.cookie.refresh-token.domain=

# Stock data provider
app.stock.provider=${STOCK_PROVIDER:mock}
app.stock.screener.request-delay-ms=${STOCK_SCREENER_REQUEST_DELAY_MS:1200}
app.stock.screener.max-retries=${STOCK_SCREENER_MAX_RETRIES:2}
app.stock.trends.request-delay-ms=${STOCK_TRENDS_REQUEST_DELAY_MS:300}

# Naver DataLab Search Trend API
app.naver.client-id=${NAVER_CLIENT_ID:}
app.naver.client-secret=${NAVER_CLIENT_SECRET:}
app.naver.news.max-requests=${NAVER_NEWS_MAX_REQUESTS:8}
app.naver.news.request-delay-ms=${NAVER_NEWS_REQUEST_DELAY_MS:250}

# Korea Investment Securities Open API
app.kis.base-url=${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
app.kis.app-key=${KIS_APP_KEY:}
app.kis.app-secret=${KIS_APP_SECRET:}
app.kis.account-no=${KIS_ACCOUNT_NO:}

# Security ???
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.web.filter.CorsFilter=DEBUG
